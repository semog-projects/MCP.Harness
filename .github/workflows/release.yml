name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (sem o 'v'), ex.: 0.1.0"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write        # NuGet Trusted Publishing (OIDC)

env:
  VERSION: ${{ github.event.inputs.version || '' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          V="${VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versão: $V"

  nuget:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Sincronizar versão no .mcp/server.json
        run: |
          V='${{ needs.version.outputs.version }}'
          f=src/MCP.Harness/.mcp/server.json
          python3 - "$f" "$V" <<'PY'
          import json, sys
          path, v = sys.argv[1], sys.argv[2]
          d = json.load(open(path))
          d["version"] = v
          for p in d.get("packages", []):
              p["version"] = v
          json.dump(d, open(path, "w"), indent=2, ensure_ascii=False)
          PY
      - run: dotnet pack src/MCP.Harness/MCP.Harness.csproj -c Release -p:Version=${{ needs.version.outputs.version }} -o out

      # Trusted Publishing (OIDC): sem API key. Requer a policy criada em
      # nuget.org/account/trustedpublishing (Repository Owner=semog-projects,
      # Repository=MCP.Harness, Workflow file=release.yml) e a variável de
      # repo NUGET_USER com o username do nuget.org. Sem a variável, pula.
      - name: NuGet login (OIDC)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push para NuGet.org
        if: vars.NUGET_USER != ''
        run: |
          dotnet nuget push "out/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: NuGet não configurado
        if: vars.NUGET_USER == ''
        run: echo "::warning::variável de repo NUGET_USER ausente — pulando o push para o NuGet.org."

  container:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcp-harness:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mcp-harness:latest

  binaries:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/MCP.Harness/MCP.Harness.csproj -c Release -r ${{ matrix.rid }} \
            -p:Version=${{ needs.version.outputs.version }} -o dist
      - name: Empacotar
        shell: bash
        run: |
          cd dist
          NAME="mcp-harness-${{ matrix.rid }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../$NAME.zip" mcp-harness.exe appsettings.json
          else
            tar czf "../$NAME.tar.gz" mcp-harness appsettings.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.rid }}
          path: |
            mcp-harness-*.tar.gz
            mcp-harness-*.zip

  release:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --generate-notes \
            artifacts/*
